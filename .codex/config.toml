# project-specific codex mcp configuration
# generated by powershell setup script

# 1. firecrawl (http)
[mcp_servers.firecrawl]
url = "https://mcp.firecrawl.dev/v2/mcp"
http_headers = { Authorization = "Bearer fc-51edc5a59eb64eabbdf6a08814f96bd6" }
enabled = true

# 2. serena (local/stdio)
[mcp_servers.serena]
command = "uv"
args = [
    "run",
    "--directory", "C:/Projects/serena",
    "serena", "start-mcp-server",
    "--context", "claude-code",
    "--project", "C:/Projects/windows-path-editor"
]
enabled = true

# 3. context7 (local/stdio)
[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp", "--api-key", "ctx7sk-6b8f80fb-a995-45eb-b54f-4a2a3be14259"]
enabled = true

# 4. exa (local/stdio via npx mcp-remote) -- EXA (Codex uchun)
[mcp_servers.exa]
command = "npx"
args = ["-y", "mcp-remote", "https://mcp.exa.ai/mcp?exaApiKey=d404da4f-dbdc-4517-97ed-3d656857e720&tools=web_search_exa,web_search_advanced_exa,get_code_context_exa,crawling_exa,company_research_exa,people_search_exa,deep_researcher_start,deep_researcher_check,deep_search_exa"]
